name: mobile-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app directory
        id: appdir
        shell: bash
        run: |
          if [ -f "apps/mobile/pubspec.yaml" ]; then
            echo "dir=apps/mobile" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Flutter pub get
        working-directory: ${{ steps.appdir.outputs.dir }}
        run: flutter pub get

      - name: Test
        working-directory: ${{ steps.appdir.outputs.dir }}
        run: flutter test

      - name: Upload golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ github.run_id }}
          path: ${{ steps.appdir.outputs.dir }}/test/widget/failures/
          if-no-files-found: ignore
          retention-days: 7
