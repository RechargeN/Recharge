name: mobile-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app directory
        id: appdir
        shell: bash
        run: |
          if [ -f "apps/mobile/pubspec.yaml" ]; then
            echo "dir=apps/mobile" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: ${{ steps.appdir.outputs.dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.appdir.outputs.dir }}
        run: flutter analyze

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Boundary checker self-test
        run: dart tools/scripts/check_boundaries.dart --self-test

      - name: Run canonical boundary check
        id: boundary_check
        continue-on-error: true
        run: >-
          dart tools/scripts/check_boundaries.dart
          --repo-root .
          --format json
          --output boundary-report.json

      - name: Print boundary summary
        if: steps.boundary_check.outcome == 'success'
        run: >-
          dart tools/scripts/check_boundaries.dart
          --repo-root .
          --format text

      - name: Verify generated boundary inventory
        if: steps.boundary_check.outcome == 'success'
        run: >-
          dart tools/scripts/check_boundaries.dart
          --repo-root .
          --format markdown
          --output docs/architecture/MOBILE_BOUNDARY_INVENTORY.md
          --check-output

      - name: Upload boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-report
          path: boundary-report.json
          if-no-files-found: warn

      - name: Enforce boundary result
        if: steps.boundary_check.outcome == 'failure'
        run: exit 1
