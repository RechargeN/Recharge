name: Backend IaC and execution manifest validation

# Validation only. This workflow has no secrets, no id-token, no cloud step and no
# apply: writing infrastructure code grants no authority to apply it (BCK-05 §36).

on:
  pull_request:
    paths:
      - ".github/workflows/backend-iac-validate.yml"
      - "apps/backend/infra/**"
      - "apps/backend/config/**"
      - "apps/backend/firestore.rules"
      - "apps/backend/firestore.indexes.json"
      - "apps/backend/scripts/verify-execution-manifest.mjs"
      - "apps/backend/scripts/verify-iac-topology.mjs"
      - "docs/runbooks/backend-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: IaC ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout without persisted authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: false
          set-safe-directory: false
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          check-latest: false
          package-manager-cache: false

      - name: Reject cloud and credential context
        run: node apps/backend/scripts/verify-no-cloud-context.mjs

      - name: Install verified Terraform archive
        run: node apps/backend/scripts/install-terraform.mjs

      - name: Frozen dependency install
        working-directory: apps/backend/functions
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Execution manifest gate
        working-directory: apps/backend/functions
        run: npm run verify:execution-manifest

      - name: IaC topology, Terraform validate and gate behaviour
        working-directory: apps/backend/functions
        run: npm run verify:iac:topology -- --require-terraform
